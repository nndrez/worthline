<ng-content select="[tableToolbar]" />
<div class="table-body-frame">
  <div #viewport class="table-viewport" role="region" [attr.aria-label]="label()" tabindex="0">
    @if (error(); as error) {
      <app-error-state
        class="table-error"
        [error]="error"
        [compact]="density() === 'compact'"
        (retry)="retry.emit()"
      />
    }
    <div class="table-content" [attr.inert]="loading() ? '' : null">
      <ng-content />
    </div>
  </div>
  @if (loading()) {
    <app-loading-state class="table-loading-overlay" [compact]="density() === 'compact'" />
  }
</div>
@if (page(); as page) {
  <app-pagination
    [page]="page"
    [disabled]="loading()"
    [compact]="density() === 'compact'"
    (pageChange)="pageChange.emit($event)"
  />
} @else if (loading() && contained()) {
  <div class="table-pagination-placeholder" aria-hidden="true"></div>
}
