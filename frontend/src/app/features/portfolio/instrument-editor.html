<app-dialog-frame
  size="form"
  [heading]="initial() ? 'instruments.edit' : 'instruments.create'"
  [busy]="mutation.busy()"
  (closed)="closed.emit()"
>
  <form (submit)="save($event)" novalidate>
    <fieldset
      [disabled]="mutation.busy()"
      class="form-grid"
      style="border: 0; padding: 0; margin: 0"
    >
      <div class="field form-wide">
        <label for="instrument-name">{{ 'fields.name' | translate }}</label>
        <input uiInput id="instrument-name" type="text" [formField]="entry.name" />
        <app-field-error
          [visible]="(attempted() || entry.name().touched()) && entry.name().invalid()"
        />
      </div>
      <div class="field">
        <label for="instrument-code">{{ 'fields.code' | translate }}</label>
        <input uiInput id="instrument-code" type="text" [formField]="entry.code" />
        <app-field-error
          [visible]="(attempted() || entry.code().touched()) && entry.code().invalid()"
        />
      </div>
      <div class="field">
        <label for="instrument-ticker">{{ 'fields.ticker' | translate }}</label>
        <input uiInput id="instrument-ticker" type="text" [formField]="entry.ticker" />
      </div>
      <div class="field form-wide">
        <label for="instrument-isin">{{ 'fields.isin' | translate }}</label>
        <input uiInput id="instrument-isin" type="text" [formField]="entry.isin" />
        <app-field-error
          [visible]="(attempted() || entry.isin().touched()) && entry.isin().invalid()"
        />
      </div>
    </fieldset>
    <app-notice class="mt-4" [error]="mutation.error()" />
    <div class="dialog-actions">
      <button
        class="btn btn-secondary"
        type="button"
        [disabled]="mutation.busy()"
        (click)="closed.emit()"
      >
        {{ 'common.cancel' | translate }}
      </button>
      <button class="btn" type="submit" [disabled]="mutation.busy()">
        {{ (mutation.busy() ? 'common.saving' : 'common.save') | translate }}
      </button>
    </div>
  </form></app-dialog-frame
>
