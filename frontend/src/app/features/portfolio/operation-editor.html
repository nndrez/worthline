<app-dialog-frame
  [heading]="initial() ? 'operations.edit' : 'operations.create'"
  description="operations.dialogDescription"
  [busy]="mutation.busy()"
  (closed)="closed.emit()"
>
  <form (submit)="save($event)" novalidate>
    <fieldset
      [disabled]="mutation.busy()"
      class="form-grid"
      style="border: 0; padding: 0; margin: 0"
    >
      <div class="field">
        <label for="operation-instrumentId">{{ 'fields.instrumentId' | translate }}</label>
        <ui-select
          inputId="operation-instrumentId"
          [formField]="entry.instrumentId"
          [searchable]="true"
          [options]="choices() | uiOptions: ('common.choose' | translate)"
        />
        <app-field-error
          [visible]="
            (attempted() || entry.instrumentId().touched()) && entry.instrumentId().invalid()
          "
        />
      </div>
      <div class="field">
        <label for="operation-date">{{ 'fields.date' | translate }}</label>
        <ui-datepicker inputId="operation-date" [formField]="entry.date" />
        <app-field-error
          [visible]="(attempted() || entry.date().touched()) && entry.date().invalid()"
        />
      </div>
      <div class="field">
        <label for="operation-type">{{ 'fields.type' | translate }}</label>
        <ui-select
          inputId="operation-type"
          [formField]="entry.type"
          [options]="[
            { value: 'BUY', label: ('types.BUY' | translate) },
            { value: 'SELL', label: ('types.SELL' | translate) },
            { value: 'DIVIDEND', label: ('types.DIVIDEND' | translate) },
          ]"
        />
        <app-field-error
          [visible]="(attempted() || entry.type().touched()) && entry.type().invalid()"
        />
      </div>
      <div class="field">
        <label for="operation-amount">{{ 'fields.amount' | translate }}</label>
        <input
          uiInput
          id="operation-amount"
          type="text"
          [formField]="entry.amount"
          inputmode="decimal"
        />
        <app-field-error
          [visible]="(attempted() || entry.amount().touched()) && entry.amount().invalid()"
        />
        <span class="field-hint">{{ 'operations.amountHint' | translate }}</span>
      </div>
      @if (model().type !== 'DIVIDEND') {
        <div class="field">
          <label for="operation-unitPrice">{{ 'fields.unitPrice' | translate }}</label>
          <input
            uiInput
            id="operation-unitPrice"
            type="text"
            [formField]="entry.unitPrice"
            inputmode="decimal"
          />
        </div>
      }
      @if (model().type !== 'DIVIDEND') {
        <div class="field">
          <label for="operation-quantity">{{ 'fields.quantity' | translate }}</label>
          <input
            uiInput
            id="operation-quantity"
            type="text"
            [formField]="entry.quantity"
            inputmode="decimal"
          />
        </div>
      }
      <div class="field">
        <label for="operation-broker">{{ 'fields.broker' | translate }}</label>
        <input uiInput id="operation-broker" type="text" [formField]="entry.broker" />
      </div>
      <div class="field">
        <label for="operation-market">{{ 'fields.market' | translate }}</label>
        <input uiInput id="operation-market" type="text" [formField]="entry.market" />
      </div>
      <div class="field form-wide">
        <label for="operation-notes">{{ 'fields.notes' | translate }}</label>
        <textarea uiInput id="operation-notes" [formField]="entry.notes" rows="3"></textarea>
      </div>
    </fieldset>
    <app-notice class="mt-4" [error]="options().error" />
    @if (!options().loading && !options().error && !choices().length) {
      <p class="inline-note mt-4">{{ 'operations.instrumentRequired' | translate }}</p>
    }
    @if (localError()) {
      <p class="form-message" role="alert">{{ localError() | translate }}</p>
    }
    <app-notice class="mt-4" [error]="mutation.error()" />
    <div class="dialog-actions">
      <button
        class="btn btn-secondary"
        type="button"
        [disabled]="mutation.busy()"
        (click)="closed.emit()"
      >
        {{ 'common.cancel' | translate }}
      </button>
      <button
        class="btn"
        type="submit"
        [disabled]="mutation.busy() || options().loading || !!options().error"
      >
        {{ (mutation.busy() ? 'common.saving' : 'common.save') | translate }}
      </button>
    </div>
  </form></app-dialog-frame
>
