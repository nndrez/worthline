<app-card
  [fill]="true"
  [scrollable]="false"
  [empty]="empty()"
  emptyTitle="dashboard.noHistory"
  emptyIcon="chart"
  [label]="'dashboard.history' | translate"
  [loading]="resource.state().loading"
  [error]="resource.state().error"
  (retry)="resource.reload()"
>
  <a
    cardEmptyActions
    class="btn btn-secondary btn-sm"
    routerLink="/balances"
    [queryParams]="{ month: month() }"
    >{{ 'dashboard.recordAction' | translate }}</a
  >
  <div cardHeader class="wealth-heading">
    <h2>{{ 'dashboard.history' | translate }}</h2>
    <div class="period-tabs" [attr.aria-label]="'dashboard.history' | translate">
      @for (count of [3, 6, 12]; track count) {
        <button
          [class.active]="period() === count"
          [attr.aria-pressed]="period() === count"
          (click)="period.set(count)"
        >
          {{ 'dashboard.months' | translate: { count } }}
        </button>
      }
    </div>
  </div>
  <app-time-series-chart
    class="chart-container"
    [points]="points()"
    [series]="series"
    [month]="month()"
    [label]="'dashboard.chartLabel' | translate"
  />
  <div class="chart-caption">
    <button
      type="button"
      class="text-link"
      (click)="detailsOpen.set(true)"
      [attr.aria-label]="'dashboard.chartTable' | translate"
    >
      {{ 'dashboard.details' | translate }}
    </button>
  </div>
</app-card>
@if (detailsOpen()) {
  <app-chart-dialog
    heading="dashboard.chartTable"
    [points]="points()"
    [series]="series"
    [month]="month()"
    [showTotal]="true"
    [loading]="resource.state().loading"
    [error]="resource.state().error"
    (retry)="resource.reload()"
    (closed)="detailsOpen.set(false)"
  />
}
