<app-page-header title="dashboard.title">
  <app-month-selector
    inputId="dashboard-month"
    [value]="month()"
    [label]="'dashboard.period' | translate"
    (valueChange)="nav.update({ month: $event })"
  />
  <a class="btn btn-sm" routerLink="/balances" [queryParams]="{ month: month() }"
    ><app-icon name="plus" />{{ 'dashboard.record' | translate }}</a
  >
</app-page-header>
<div class="dashboard-board">
  <app-panel-tabs prefix="dashboard" [items]="panels" [(value)]="activePanel" />
  <app-current-situation
    id="dashboard-current"
    [month]="month()"
    class="dashboard-panel current"
    [class.is-active]="activePanel() === 'current'"
    [attr.role]="compactView() ? 'tabpanel' : null"
    [attr.aria-labelledby]="compactView() ? 'dashboard-tab-current' : null"
  />
  <app-wealth-allocation
    id="dashboard-allocation"
    [month]="month()"
    class="dashboard-panel allocation"
    [class.is-active]="activePanel() === 'allocation'"
    [attr.role]="compactView() ? 'tabpanel' : null"
    [attr.aria-labelledby]="compactView() ? 'dashboard-tab-allocation' : null"
  />
  <div class="metrics-grid">
    <app-dashboard-metric
      kind="income"
      [month]="month()"
      (monthSelected)="nav.update({ month: $event })"
    />
    <app-dashboard-metric
      kind="expenses"
      [month]="month()"
      (monthSelected)="nav.update({ month: $event })"
    />
    <app-dashboard-metric
      kind="cash-flow"
      [month]="month()"
      (monthSelected)="nav.update({ month: $event })"
    />
  </div>
  <app-wealth-history
    id="dashboard-wealth"
    class="dashboard-panel wealth"
    [class.is-active]="activePanel() === 'wealth'"
    [attr.role]="compactView() ? 'tabpanel' : null"
    [attr.aria-labelledby]="compactView() ? 'dashboard-tab-wealth' : null"
    [month]="month()"
  />
</div>
