spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/worthline}
spring.datasource.username=${DB_USERNAME:worthline}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# PostgreSQL constraint messages can contain submitted financial values.
logging.level.org.hibernate.orm.jdbc.error=OFF
spring.data.web.pageable.max-page-size=100
